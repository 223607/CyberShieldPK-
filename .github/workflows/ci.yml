name: Build and type-check

on:
  push:
    branches:
      - main
      - fix/academy-payment-certificate-trust
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Type-check
        run: npm run lint
      - name: Build production bundle
        run: npm run build
